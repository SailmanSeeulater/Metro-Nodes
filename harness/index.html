<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Metro Nodes harness</title>
<link rel="stylesheet" href="../styles.css" />
<style>
	html, body { margin: 0; height: 100%; }
	body {
		--background-primary: #1e1e1e; --background-secondary: #262626;
		--background-modifier-border: #363636; --text-normal: #dadada;
		--text-muted: #a3a3a3; --text-faint: #666; --interactive-accent: #8a7cf8;
		background: var(--background-primary); color: var(--text-normal);
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		display: flex; flex-direction: column;
	}
	body.theme-light {
		--background-primary: #ffffff; --background-secondary: #f6f6f6;
		--background-modifier-border: #e0e0e0; --text-normal: #222;
		--text-muted: #6b6b6b; --text-faint: #aaa; --interactive-accent: #7052e0;
	}
	#bar { display: flex; gap: 8px; padding: 6px 10px; font-size: 12px; align-items: center; border-bottom: 1px solid var(--background-modifier-border); }
	#stage { flex: 1; position: relative; min-height: 0; }
</style>
</head>
<body>
	<div id="bar">Harness · data <select id="dataset"></select> <button id="theme">toggle theme</button></div>
	<div id="stage"></div>
	<script src="dist/harness.js"></script>
</body>
</html>
